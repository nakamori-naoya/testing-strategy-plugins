# design-e2e-test-scenarios — 重要価値経路のE2EテストシナリオMarkdownを1本作る。
version: 2
name: design-e2e-test-scenarios
description: 確定済みテスト戦略から、実構成でしか検出できない接続を担う少数のE2Eシナリオを設計する。
inputs: [target_repository, request, test_strategy_path, scope, references, document_destination]
instructions:
  execution:
    directive: 同じagentがstepsを上から順に実行し、価値経路と最小配置の判断を保持したままシナリオを保存する
requires:
  - {plugin: grill, marketplace: grill}
  - {plugin: write-doc, marketplace: write-doc}
steps:
  - id: fix-target-and-rules
    agent_work: invoking_agent
    purpose: 対象、戦略、scope、適用規約、references、保存先を固定する
    needs: [target_repository, request, test_strategy_path, scope, references, document_destination]
  - id: map-coverage
    skill: map-test-coverage
    purpose: 品質リスク、既存証拠、残余リスク、最小の担当レベル、サイズ、重複排除を対応付ける
    needs: [target_repository, test_strategy_path, scope, references]
    provides: [coverage_map, coverage_gaps, coverage_status]
  - id: investigate-value-paths
    agent_work: invoking_agent
    purpose: 外部から観測できる開始と完了、公開入口、実コンポーネント、非同期境界、診断点を調べる
    needs: [coverage_map]
    provides: [value_path_findings]
  - id: settle-e2e-decisions
    playbook: grill
    purpose: 答えで重要経路、実物境界、完了oracle、外部代替、リリース判断が変わる未決だけを解消する
    needs: [request, scope, references, coverage_map, value_path_findings]
    provides: [decisions, open_questions]
  - id: design-scenarios
    agent_work: invoking_agent
    purpose: 実構成でしか検出できない接続、最小操作列、完了条件、最終観測、下位との分担を設計する
    needs: [coverage_map, value_path_findings, decisions, open_questions]
  - id: compose-document
    agent_work: invoking_agent
    purpose: 重要価値経路と意図した重複排除を持つE2Eシナリオ本文を組み立てる
    provides: [scenario_document_text]
  - id: save-document
    playbook: write-doc
    purpose: シナリオ本文をdocument_destinationへMarkdown正本として保存する
    needs: [scenario_document_text, document_destination, references]
    provides: [scenario_document_path]
  - id: read-back-and-evaluate
    agent_work: invoking_agent
    purpose: 保存した正本を読み戻し、価値経路、実構成理由、観測可能性、最小配置、サイズを意味評価する
    needs: [scenario_document_path]
